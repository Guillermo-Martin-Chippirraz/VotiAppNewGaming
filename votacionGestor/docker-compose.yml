
services:

  postgres:
    image: postgres:15
    container_name: votacion_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Root
      POSTGRES_DB: eventosdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: votacion_backend
    restart: always
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventosdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Root
      JWT_SECRET: ClaveSecretaDocker
    ports:
      - "8443:8443"
    volumes:
      - ./src/main/resources/eventos.p12:/app/eventos.p12
volumes:
  postgres_data: