spring.application.name=votacionGestor
spring.datasource.url=jdbc:postgresql://localhost:5432/eventosdb
spring.datasource.username=postgres
spring.datasource.password=Root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

string.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:eventos.p12
server.ssl.key-store-password=PasswordTemporal
server.ssl.key-store-type=PKCS12